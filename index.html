<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="The Compendium"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=7.4"><link rel="stylesheet" href="themes.css?v=7.4"><title>The Compendium</title></head><body><div id="app"><header class="topbar"><div class="brand-block"><div class="brand-title-row"><img class="brand-bird" src="apple-touch-icon.png" alt=""><h1 class="brand-title">The Compendium</h1></div><p id="summaryText" class="muted">0 species discovered</p></div><button id="addBirdBtn" class="icon-btn primary">＋</button></header><section class="toolbar"><div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" autocomplete="off" placeholder="Search common name…"></div><select id="sortSelect"><option value="date-desc">Newest added</option><option value="date-asc">Oldest added</option><option value="name-asc">A–Z</option><option value="name-desc">Z–A</option><option value="rarity-asc">Rarity: low → high</option><option value="rarity-desc">Rarity: high → low</option></select></section><section id="rarityFilters" class="rarity-filters"></section><main id="birdGrid" class="bird-grid"></main><section id="emptyState" class="empty-state hidden"><div class="empty-bird">🪶</div><h2>Your compendium is empty</h2><p>Add your first photographed species.</p><button class="primary-btn" id="emptyAddBtn">Add bird</button></section></div><dialog id="birdDialog" class="sheet-dialog"><form method="dialog" class="sheet"><div class="sheet-head"><button value="cancel" class="text-btn">Cancel</button><h2 id="birdDialogTitle">Add bird</h2><button id="saveBirdBtn" value="default" class="text-btn accent">Save</button></div><div class="sheet-body"><label class="photo-picker hero-picker"><input id="birdPhotoInput" type="file" accept="image/*" hidden><img id="birdPhotoPreview" alt=""><span id="birdPhotoPlaceholder">Add or change main photo</span></label><label><span>Common name</span><input id="commonNameInput" type="text" required></label><div class="lookup-row"><button type="button" id="lookupBtn" class="secondary-btn">Look up species</button><span id="lookupStatus" class="muted small"></span></div><label><span>Scientific name</span><input id="scientificNameInput" type="text"></label><fieldset><legend>Class</legend><div id="rarityPicker" class="rarity-picker"></div><div class="auto-class-row"><button type="button" id="autoClassBtn" class="secondary-btn">Suggest class from location</button><span id="autoClassStatus" class="muted small"></span></div></fieldset><label><span>General notes <em>optional</em></span><textarea id="birdNotesInput" rows="4"></textarea></label><div class="first-sighting"><h3>First sighting</h3><label><span>Date</span><input id="birdDateInput" type="date"></label><label><span>Location</span><div class="location-row"><input id="birdLocationInput" type="text"><button type="button" id="useLocationBtn" class="mini-btn">Use GPS</button></div></label><label><span>Sighting notes</span><textarea id="sightingNotesInput" rows="3"></textarea></label></div></div></form></dialog><dialog id="detailDialog" class="detail-dialog"><div class="detail"><div class="detail-top"><button id="closeDetailBtn" class="round-btn">×</button><button id="editBirdBtn" class="round-btn">✎</button></div><img id="detailHero" class="detail-hero" alt=""><div class="detail-content"><div class="title-line"><span id="detailRarityDot" class="rarity-dot large"></span><div><h2 id="detailCommonName"></h2><p id="detailScientificName" class="scientific"></p></div></div><p id="detailMeta" class="muted"></p><p id="detailNotes"></p><div class="section-title"><h3>Sightings</h3><button id="addSightingBtn" class="secondary-btn">＋ Add sighting</button></div><div id="sightingsList" class="sightings-list"></div><button id="deleteBirdBtn" class="delete-bird-btn">Delete bird from compendium</button></div></div></dialog><dialog id="sightingDialog" class="sheet-dialog"><form method="dialog" class="sheet"><div class="sheet-head"><button value="cancel" class="text-btn">Cancel</button><h2>Add sighting</h2><button id="saveSightingBtn" value="default" class="text-btn accent">Save</button></div><div class="sheet-body"><input id="sightingPhotosInput" type="file" accept="image/*" multiple><div id="sightingPhotoStrip" class="photo-strip"></div><input id="sightingDateInput" type="date"><div class="location-row"><input id="sightingLocationInput" type="text"><button type="button" id="sightingUseLocationBtn" class="mini-btn">Use GPS</button></div><textarea id="sightingNotesInput2" rows="4"></textarea></div></form></dialog><dialog id="editSightingDialog" class="sheet-dialog"><form method="dialog" class="sheet"><div class="sheet-head"><button value="cancel" class="text-btn">Cancel</button><h2>Edit sighting</h2><button id="updateSightingBtn" value="default" class="text-btn accent">Save</button></div><div class="sheet-body"><input id="editSightingPhotosInput" type="file" accept="image/*" multiple><div id="editSightingExistingPhotos" class="photo-strip"></div><div id="editSightingNewPhotoStrip" class="photo-strip"></div><input id="editSightingDateInput" type="date"><div class="location-row"><input id="editSightingLocationInput" type="text"><button type="button" id="editSightingUseLocationBtn" class="mini-btn">Use GPS</button></div><textarea id="editSightingNotesInput" rows="4"></textarea></div></form></dialog><template id="birdTileTemplate"><button class="bird-tile"><img class="tile-photo" alt=""><span class="multi-sighting-badge"><span></span><span></span></span><div class="tile-overlay"><span class="rarity-dot"></span><span class="tile-name"></span></div></button></template><template id="sightingTemplate"><article class="sighting-card"><div class="sighting-head"><div><strong class="sighting-date"></strong><div class="sighting-location muted small"></div></div><div class="sighting-actions"><button type="button" class="mini-btn edit-sighting-btn">Edit</button><button type="button" class="mini-btn delete-sighting-btn">Delete</button></div></div><div class="photo-strip sighting-photos"></div><p class="sighting-notes"></p></article></template><script src="theme.js?v=7.4"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=7.4"></script><script src="country-sort.js?v=7.4"></script><script src="class-location.js?v=7.4"></script><script src="families.js?v=7.4"></script><script src="family-species-search.js?v=7.4"></script><script src="mystery-regions.js?v=7.4"></script><script src="acquired-family-link.js?v=7.4"></script><script src="acquired-reference-photo.js?v=7.4"></script><script src="desktop-birds.js?v=7.4"></script><script src="points-counter.js?v=7.4"></script><script src="achievements.js?v=7.4"></script><script src="achievement-rewards.js?v=7.4"></script><script src="ability-effects.js?v=7.4"></script><script src="cloud-sync.js?v=7.4"></script></body></html>
